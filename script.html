<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="influencer_style.css"> <!-- 공통 CSS -->
    <link rel="stylesheet" href="script.css"> <!-- 페이지별 고유 CSS -->
    <title>Customized Content</title>
</head>
<body data-page="script">
    <div class="content-container customized-content">
        <h1>광고 스크립트 만들기</h1>
        <form id="script-form">
            <input type="text" id="channelId" placeholder="Channel ID" required>
            <input type="text" id="productName" placeholder="상춤이름" required>
            <input type="text" id="productDescription" placeholder="상품설명" required>
            <input type="number" id="productPrice" placeholder="상품가격" required>
            <input type="number" id="targetAge" placeholder="광고나이" required>
            <select id="targetGender" required>
                <option value="" disabled selected>광고할 성벼</option>
                <option value="남자">Male</option>
                <option value="여자">Female</option>
                <option value="둘다">Unisex</option>
            </select>
            <input type="text" id="hashtags" placeholder="해쉬태그" required>
            <button type="submit">스크립트 만들기</button>
        </form>
        <div id="result-container">
            <h2>생성된 스크립트</h2>
            <pre id="script-result"></pre>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.5.1/socket.io.min.js"></script>
    <script src="config/config.js"></script>
    <script src="navbar_influencer.js"></script>
    <script src="script.js"></script> <!-- 맞춤 콘텐츠 JS -->
</body>
</html>
