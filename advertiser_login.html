<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="advertiser_login.css">
    <title>Advertiser Login</title>
</head>
<body>
    <div class="login-container">
        <h1>Advertiser Login</h1>
        <input type="text" id="ad_id" class="input-field" placeholder="ID">
        <input type="password" id="password" class="input-field" placeholder="Password">
        <div class="forgot-password" id="forgotPassword">Forgot password?</div>
        <div class="button" id="loginButton">Login</div>
        <div class="button secondary" id="registerButton">Register</div>
    </div>

    <script src="config/config.js"></script>
    <script src="advertiser_login.js"></script>
</body>
</html>
