<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertiser Messenger</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="messenger.css">
</head>
<body data-page="messenger">
    <div class="content-container">
        <!-- Friends List -->
        <div id="friendsContainer" class="friends-container">
            <h2>친구 목록</h2>
            <ul id="friendsList">
                <!-- Friend list dynamically loaded here -->
            </ul>
        </div>
        
        <!-- Chat Room -->
        <h1 id="chatRoomTitle">채팅방 제목</h1>
        <p id="participants">참여자 정보가 여기에 표시됩니다.</p>
        <div class="form-container">
            <div id="chatMessages" class="message-container">
                <!-- Messages will be dynamically added here -->
            </div>
            
            <!-- Typing Indicator -->
            <div id="typingIndicator" class="typing-indicator"></div>
            
            <!-- Message Input -->
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요" />
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.1/socket.io.min.js"></script>
    <script src="config/config.js"></script>
    <script src="navbar.js"></script>
    <script src="messenger_advertiser.js"></script>
</body>
</html>
