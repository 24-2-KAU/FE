<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Login & Signup</title>
    <link rel="stylesheet" href="influencer_login.css">
</head>
<body>
    <div class="container">
        <h1>Influencer Platform</h1>
        <p>구글로 로그인하거나 회원가입하세요</p>
        <button class="login-btn" onclick="login()">Google 로그인</button>
        <button class="signup-btn" onclick="signup()">Google 회원가입</button>
    </div>

    <script src="config/config.js"></script>
    <script>
        function login() {
            window.location.href = `${window.config.apiURL}/login`;
        }

        function signup() {
            window.location.href = `${window.config.apiURL}/signup`;
        }
    </script>
</body>
</html>
